<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Detail</title>
</head>
<body>
    <h1>{{expense.expense_name}}</h1>
    <p>Category:{{ expense.category}}</p>
    <p>Price:{{ expense.expense_price}}</p>
    <p>Date bought:{{ expense.date_bought}}</p>

    <a href="{% url 'expense_list' %}">Back</a>
    <a href="{% url 'update_expense' id=expense.id %}">Edit</a>
    <a href="{% url 'delete_expense' id=expense.id %}" >Delete</a>
</body>
</html>
