<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADD</title>
</head>
<body>
    <h1>Add Expense</h1>
    <form method="POST">
        {% csrf_token %}
        <p>{{form.category}}</p> <a href="{% url 'add_category'  %}">Add Category</a> <br>
        <p>Name:{{form.expense_name}}</p>
        <p>Price:{{form.expense_price}}</p>
        <p>Date:{{form.date_bought}}</p>

        <a href="{% url 'expense_list' %}" class="back-btn">Back</a>
        <button class="submit-btn" button>Submit</button>
    </form>
    
</body>
</html>
