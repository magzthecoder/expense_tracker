{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADD</title>
</head>
<body>
    <h1>Add Expense</h1>
    <form method="POST" id="form">
        {% csrf_token %}
        <p id="category">Category: {{form.category}}</p> <a href="{% url 'add_category'  %}">Add Category</a> <br>
        <p id="name">Name:{{form.expense_name}}</p>
        <p id="price">Price:${{form.expense_price}}</p>
        <p id="date">Date:{{form.date_bought}}</p>
        <a href="{% url 'expense_list' %}" class="back-btn">Back</a>
        <button class="submit-btn" id="sub-btn">Submit</button>
    </form>
    
    <script src="{% static 'js/add_expense.js' %}" defer></script>
</body>
</html>
