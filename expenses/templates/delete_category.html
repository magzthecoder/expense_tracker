<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete</title>
</head>
<body>
    <h1>Delete Category</h1>
    <p>⚠️ Deleting this category will also delete all expenses associated with it.</p>
    <form action="{% url 'delete_category' id=category.id %}" method="POST">
        {% csrf_token %}
        <div class="btn">
            <a href="{% url 'category_detail' id=category.id %}">Back</a>
            <button class="submit-btn" >Confirm</button>
        </div>
    </form>
    
</body>
</html>
