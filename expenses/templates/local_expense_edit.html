{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit</title>
</head>
<body data-user-id="{{ user.id }}">
    <form id="form">
        <p id="error"></p>
        <input type="text" id="name" placeholder="Name..."><br>
        <input type="text" id="category" placeholder="Category..."><br>
        <input type="number" step="0.01" id="price" placeholder="Price...."><br>
        <input type="date" id="date"><br>
        <button id="save" type="submit">Save</button><br>
    </form>
    
    <button id="cancel">Cancel</button>
</body>
    <script src="{% static 'js/local_expense_edit.js' %}" defer></script>
</html>
