{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses List</title>
</head>
<body>
    <h1>My Expenses</h1>
    <form action="{% url 'search_expense' %}" method="GET" style="margin-bottom: 20px;">
            <input type="text" name="q" value="{{ query }}" placeholder="Search...">
            <button type="submit">Search</button>
         </form>
    <!-- {% for expense in expenses %}
    <p><a href="{% url 'expense_detail' expense.id %}">{{expense.expense_name}}</a></p>
    {% endfor %} -->

    <div id="saved"></div>

    
    {% if user.is_authenticated %} 
            <p>Welcome, {{ user.username }}!</p>
            <div class="actions"> 
                <p><a href="{% url 'category_list' %}">View By Category</a></p>
                <a href="{% url 'logout_page' %}" >Logout</a> 
                <a href="{% url 'add_expense' %}">Add</a>
            </div> 
    {% else %} 
            <a href="{% url 'login_page' %}">Login</a> 
            <a href="{% url 'register_page' %}">Register</a> 
    {% endif %} 
</body>
    <script src="{% static 'js/expense_list.js' %}" defer></script>
</html>
